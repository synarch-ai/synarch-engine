version: '3.8'

services:
  # NATS JetStream (Event Bus)
  nats:
    image: nats:latest
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring/management
    command: "-js -m 8222"
    volumes:
      - nats_data:/data

  # PostgreSQL (State Store for LangGraph)
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"  # 5433 external to avoid conflict with local PG on 5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synarch_local}
      POSTGRES_DB: ${POSTGRES_DB:-synarch}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Qdrant (Vector Memory)
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Ollama (Local LLMs) - Optional if running on host, but good for isolation
  # Note: GPU passthrough requires specific docker config. running CPU mode by default here.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  nats_data:
  postgres_data:
  qdrant_data:
  ollama_data:
