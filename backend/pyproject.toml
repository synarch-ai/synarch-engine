[tool.poetry]
name = "synarch-engine"
version = "0.1.0"
description = "Backend for Synarch Engine"
authors = ["Synarch Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.3"
asyncpg = "^0.29.0"
nats-py = "^2.6.0"
langgraph = "^0.2.0"
pydantic-settings = "^2.1.0"
sse-starlette = "^2.0.0"
redis = "^7.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
mypy = "^1.8.0"
ruff = "^0.2.2"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "E402", "B006", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
